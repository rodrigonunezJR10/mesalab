<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MesaLab — Panel de Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>

  <header>
    <span class="logo">Mesa<span>Lab</span></span>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="login.html">Cerrar sesión</a>
    </nav>
  </header>

  <main>
    <div class="panel-layout">

      <!-- Columna izquierda: Formulario de registro -->
      <section>
        <div id="user-info-box" class="user-info" style="display:none;">
          <strong id="nombre-usuario">Usuario</strong>
          <span id="rol-usuario" style="opacity:.8;"></span>
        </div>

        <div class="card">
          <h2 class="panel-title">Nueva Solicitud</h2>

          <div class="form-group">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" placeholder="Describe brevemente el problema" />
          </div>

          <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" placeholder="Detalla el problema (mínimo 10 caracteres)"></textarea>
          </div>

          <div class="form-group">
            <label for="categoria">Categoría</label>
            <select id="categoria">
              <option value="">Selecciona una categoría</option>
            </select>
          </div>

          <div class="form-group">
            <label for="prioridad">Prioridad</label>
            <select id="prioridad">
              <option value="">Selecciona la prioridad</option>
              <option value="Baja">Baja</option>
              <option value="Media">Media</option>
              <option value="Alta">Alta</option>
            </select>
          </div>

          <button class="btn btn-primary btn-block" onclick="registrarSolicitud()">Enviar Solicitud</button>

          <div id="mensaje-solicitud" class="mensaje"></div>
        </div>
      </section>

      <!-- Columna derecha: Tabla de solicitudes -->
      <section>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem;">
          <h2 class="panel-title" style="margin:0; border:0; padding:0;">Solicitudes Registradas</h2>
          <button class="btn btn-secondary btn-sm" onclick="cargarSolicitudes()">↻ Actualizar</button>
        </div>

        <div class="tabla-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Usuario</th>
                <th>Categoría</th>
                <th>Título</th>
                <th>Prioridad</th>
                <th>Estado</th>
                <th>Fecha</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="tabla-solicitudes">
              <tr>
                <td colspan="8" style="text-align:center; padding:2rem; color:#94a3b8;">
                  Cargando solicitudes...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <footer>
    <p>&copy;  2026 MesaLaB — Instituto Profesional Santo Tomás · Programación Web</p>
  </footer>

  <script src="js/validaciones.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
