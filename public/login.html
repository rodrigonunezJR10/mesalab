<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MesaLab — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>

  <button id="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema" class="btn btn-sm btn-secondary" style="position:fixed;top:12px;right:12px;z-index:999;">Tema</button>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand">
        <h2 class="brand-title text-corp">MesaLaB</h2>
        <p>Accede con tu correo institucional</p>
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="correo@mesalab.cl" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn btn-corp btn-block" onclick="iniciarSesion()">Ingresar</button>

      <div id="mensaje" class="mensaje"></div>

      <p style="text-align:center; margin-top:1.25rem; font-size:0.88rem; color:#64748b;">
        <a href="index.html">← Volver al inicio</a>
      </p>
    </div>
  </div>

  <script src="js/validaciones.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
